server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Common proxy headers for all backend locations
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # FORCE HTTPS: This tells Spring the external request was secure
    proxy_set_header X-Forwarded-Proto https;

    # Consolidated Backend Routes
    location ~ ^/(swagger-ui|api-docs|v3/api-docs|api)/ {
        proxy_pass http://book-backend:8080;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
