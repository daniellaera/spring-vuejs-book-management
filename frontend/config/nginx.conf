server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 1. Handle API and Swagger specifically
    # This regex captures all backend-related traffic
    location ~ ^/(swagger-ui|api-docs|v3/api-docs|api) {
        proxy_pass http://book-backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Crucial: This fixes the "Mixed Content" by telling Spring to use HTTPS
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Ensure the backend response doesn't get rewritten incorrectly
        proxy_redirect off;
    }

    # 2. Handle Frontend Static Files
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
}
