<div class="rating-form">
  @if (canRate()) {
    <div class="form-group">
      <label class="text-lg font-semibold mb-2 block">Rate this book</label>

      <p-rating
        [(ngModel)]="ratingValue"
        [stars]="5"
        class="mb-3">
      </p-rating>

      @if (errorMessage()) {
        <p-message
          severity="error"
          styleClass="w-full">
          {{ errorMessage() }}
        </p-message>
      }

      <p-button
        label="Submit Rating"
        icon="pi pi-star-fill"
        [disabled]="!ratingValue() || isSubmitting() || !authService.isLoggedIn()"
        [loading]="isSubmitting()"
        (onClick)="submitRating()"
        styleClass="w-full mt-3">
      </p-button>
    </div>
  } @else if (authService.isLoggedIn()) {
    <p-message severity="info" styleClass="w-full">
      You have already rated this book.
    </p-message>
  } @else {
    <p-message severity="warn" styleClass="w-full">
      Please log in to rate this book.
    </p-message>
  }
</div>

<p-toast></p-toast>
