spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_SECRET}
            redirect-uri: ${GITHUB_REDIRECT_URI}

  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-20250514
          max-tokens: 1024
          temperature: 0.2

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
  jwtRefreshExpirationMs: 86400000

frontend:
  url: ${FRONTEND_URL}

social:
  feature:
    oauth2:
      enabled: true

quartz:
  scheduler:
    cron: "0 0 0 * * ?"  # Every day at midnight

app:
  version: @project.version@
  build-time: @maven.build.timestamp@

qdrant:
  url: ${QDRANT_URL}
  collection: books

ai:
  enabled: true
  daily-limit: 20

ollama:
  api-url: ${OLLAMA_URL}

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  # This forces the generated OpenAPI JSON to use the correct server URL
  server-variable:
    url: https://bookmanagement.daniellaera.com